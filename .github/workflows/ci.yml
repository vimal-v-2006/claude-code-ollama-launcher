name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils python3 python3-gi gir1.2-gtk-3.0 shellcheck
      - name: Run checks
        run: make test-all
      - name: Build release archive
        run: make release
      - name: Verify checksum
        run: cd dist && sha256sum -c *.sha256
      - name: Test exact release archive
        run: |
          tmp=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$tmp"
          make -C "$tmp"/* test-all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify tag matches application version
        run: test "$GITHUB_REF_NAME" = "v$(python3 -c 'import core; print(core.VERSION)')"
      - name: Download tested release archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: dist
      - name: Verify checksum
        run: cd dist && sha256sum -c *.sha256
      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256
